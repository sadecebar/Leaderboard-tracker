name: tracker-runner

on:
  schedule:
    - cron: "*/15 * * * *"   # backup restarter only; the job normally restarts itself
  workflow_dispatch:
    inputs:
      preview:
        description: "Send a test Flower report now and stop"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: tracker-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # ---- leaderboard settings: for a new board, change only this block ----
      TRACK_BOARD: "Clan War #3"       # exact tab name on petsuniverse.org/players
      TRACK_TITLE: "Clan War"          # shown as "<TITLE> leaderboard"
      TRACK_EMOJI: "⚔️"
      TRACK_MIN_EXP: "0"               # wrong-board guard: top value must be >= 10^this (0 = off; war points are small)
      TRACK_DB: "data/war3.db"         # use a NEW file per board so histories don't mix
      TRACK_USER: "imnotsadece"
      TRACK_SOURCE: "war"              # "war" = Clan War board via the site API (you + your clan, even outside the top 100); "page" = any other tab
      TRACK_EVERY_MIN: "30"            # report every N minutes (60 = hourly)
      STOP_AT: "2026-12-04T19:00:00+01:00"   # Fri 4 Dec 19:00 Stockholm: Clan War #3 ends
    steps:
      - uses: actions/checkout@v4
      - name: Check stop time
        id: gate
        run: |
          if [ -n "$STOP_AT" ] && [ "$(date -u +%s)" -ge "$(date -d "$STOP_AT" +%s)" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.done != 'true'
        with:
          python-version: "3.12"
      - name: Install browser
        if: steps.gate.outputs.done != 'true'
        run: pip install playwright pillow && playwright install --with-deps chromium
      - name: Run tracker loop
        id: loop
        if: steps.gate.outputs.done != 'true'
        run: python -u runner.py   # -u: log lines appear immediately
        env:
          HATCH_QUERY: ${{ secrets.HATCH_QUERY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FLOWER_WEBHOOK_URL: ${{ secrets.FLOWER_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          PREVIEW: ${{ inputs.preview }}
      - name: Start the next run
        if: ${{ !cancelled() && inputs.preview != true && steps.gate.outputs.done != 'true' && steps.loop.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
