name: clans-runner

on:
  schedule:
    - cron: "*/15 * * * *"   # backup restarter only; the job normally restarts itself
  workflow_dispatch:
    inputs:
      preview:
        description: "Send a test clan report now and stop"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: clans-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # ---- clan tracker settings (clans.py) ----
      CLANS_FOLLOW: "Sade,TURKIYE"     # clans always shown, even outside the top 10 (exact name or tag, comma separated)
      CLANS_MINE: "A2H"                # your own clan's tag: marked "YOUR CLAN"
      CLANS_DB: "data/clans.json"      # history: one snapshot per hour
      TRACK_ACCENT: "#38bdf8"          # picture + Discord color
      TRACK_LABEL: "🛡️ CLANS"          # badge on the pictures
      TRACK_HEADER: "🛡️🛡️ **CLAN WAR · CLANS** 🛡️🛡️"   # line above each post
      STOP_AT: "2026-12-04T19:00:00+01:00"   # Fri 4 Dec 19:00 Stockholm: Clan War #3 ends
    steps:
      - uses: actions/checkout@v4
      - name: Check stop time
        id: gate
        run: |
          if [ -n "$STOP_AT" ] && [ "$(date -u +%s)" -ge "$(date -d "$STOP_AT" +%s)" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.done != 'true'
        with:
          python-version: "3.12"
      - name: Install browser
        if: steps.gate.outputs.done != 'true'
        run: pip install playwright pillow && playwright install --with-deps chromium
      - name: Run tracker loop
        id: loop
        if: steps.gate.outputs.done != 'true'
        run: python -u clans.py   # -u: log lines appear immediately
        env:
          CLANS_WEBHOOK_URL: ${{ secrets.CLANS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # used only if CLANS_WEBHOOK_URL is missing
          PREVIEW: ${{ inputs.preview }}
      - name: Start the next run
        if: ${{ !cancelled() && inputs.preview != true && steps.gate.outputs.done != 'true' && steps.loop.outputs.done != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
